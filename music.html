<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player">
    <div class="cover">
      <img id="cover" src="https://gradient.postermywall.com/wp-content/uploads/2021/08/Copy-of-MixtapeAlbum-Cover-Art-1024x1024.jpg" alt="Cover">
    </div>
    <div class="info">
      <h2 id="title">Song Title</h2>
      <p id="artist">Artist Name</p>
    </div>

    <audio id="audio" src="c:\Users\ishas\Downloads\hopeful-love-romantic-music-340835.mp3"></audio>

    <div class="controls">
      <button onclick="prevSong()">⏮</button>
      <button onclick="togglePlay()" id="playBtn">▶️</button>
      <button onclick="nextSong()">⏭</button>
    </div>

    <div class="progress-container" onclick="setProgress(event)">
      <div class="progress" id="progress"></div>
    </div>

    <div class="time">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="volume">
      <label>🔉</label>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7">
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
